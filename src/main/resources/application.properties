spring.datasource.url=${DB_URL:jdbc:mariadb://mariadb:3306/imobiliaria_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rayGabriel}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.configuration.ignore-unsupported-db=true
spring.flyway.baseline-on-migrate=true


spring.threads.virtual.enabled=true
app.upload.dir=${UPLOAD_DIR:/home/api-bairros/uploads}
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
spring.servlet.multipart.max-file-size=10MB 
spring.servlet.multipart.max-request-size=50MB

server.forward-headers-strategy=framework
